name: "MAGI Review"
description: "Multi-persona AI code review system inspired by Evangelion MAGI"
author: ""

branding:
  icon: "eye"
  color: "purple"

inputs:
  gemini_api_key:
    description: "Gemini API Key for authentication (personal use)"
    required: false
  gcp_project_id:
    description: "GCP Project ID for Vertex AI authentication (enterprise)"
    required: false
  gcp_location:
    description: "Optional Vertex AI location override; otherwise chosen for the model"
    required: false
  openai_api_key:
    description: "OpenAI API key for Responses API models"
    required: false
  anthropic_api_key:
    description: "Anthropic API key for Claude models"
    required: false
  slack_webhook_url:
    description: "Slack Incoming Webhook URL for notifications"
    required: false
  config_path:
    description: "Optional repository-relative configuration path, read from the PR base commit"
    required: false

outputs:
  coverage:
    description: "JSON diff coverage: complete, totalFiles, reviewedFiles, omittedFiles, truncatedFiles"
  reviewed_head_sha:
    description: "PR head commit examined by this run; check result before trusting its verdict"
  result:
    description: "Review result (approved/rejected/skipped/error)"
  skip_reason:
    description: "Skip reason when result is skipped"
  votes:
    description: "JSON string of individual persona votes"
  comment_status:
    description: "PR comment status (success/failed/skipped)"
  labels_status:
    description: "Label apply status (success/failed/skipped)"
  slack_status:
    description: "Slack notification status (success/failed/skipped)"

runs:
  using: "node24"
  main: "dist/index.js"
